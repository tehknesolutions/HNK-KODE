name: Gate 03 Authority Independence

on:
  push:
    branches:
      - gate-03-authority-independence
    paths:
      - 'packages/**'
      - '.github/workflows/gate-03-authority-independence.yml'
  pull_request:
    paths:
      - 'packages/**'
      - '.github/workflows/gate-03-authority-independence.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-authority-independence:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout HNK-KODE
        uses: actions/checkout@v4

      - name: Fetch frozen CODEX source
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_SHA='3027151d18176fd5ae46a04b2ac8ed8424bf68db'
          curl --fail --location --retry 3 \
            "https://github.com/tehknesolutions/codex-hnk/archive/${SOURCE_SHA}.tar.gz" \
            --output /tmp/codex-hnk.tar.gz
          mkdir -p /tmp/codex-source
          tar -xzf /tmp/codex-hnk.tar.gz --strip-components=1 -C /tmp/codex-source
          echo "SOURCE_SHA=$SOURCE_SHA"

      - name: Diagnose source-locked HNK linguas runtime
        shell: bash
        run: |
          set -euo pipefail
          failed=0
          for file in index.mjs authored.mjs cycle1.mjs grammar-core-v1.mjs; do
            src="/tmp/codex-source/packages/hnk-linguas/src/$file"
            dst="packages/hnk-linguas/src/$file"
            echo "::group::SOURCE-LOCK $file"
            if [[ ! -f "$src" ]]; then echo "MISSING SOURCE: $src"; failed=1; echo '::endgroup::'; continue; fi
            if [[ ! -f "$dst" ]]; then echo "MISSING DESTINATION: $dst"; failed=1; echo '::endgroup::'; continue; fi
            echo "SOURCE_SHA256=$(sha256sum "$src" | cut -d' ' -f1)"
            echo "DEST_SHA256=$(sha256sum "$dst" | cut -d' ' -f1)"
            echo "SOURCE_BYTES=$(wc -c < "$src")"
            echo "DEST_BYTES=$(wc -c < "$dst")"
            if cmp --silent "$src" "$dst"; then
              echo 'BYTE_IDENTICAL=YES'
            else
              echo 'BYTE_IDENTICAL=NO'
              echo 'FIRST_DIFF:'
              cmp -l "$src" "$dst" | head -n 20 || true
              echo 'TEXT_DIFF:'
              diff -u "$src" "$dst" | head -n 120 || true
              failed=1
            fi
            echo '::endgroup::'
          done
          if [[ "$failed" -ne 0 ]]; then
            echo 'SOURCE_LOCK_RESULT=FAIL'
            exit 1
          fi
          echo 'SOURCE_LOCK_RESULT=PASS'

      - name: Diagnose preserved regression tests
        shell: bash
        run: |
          set -euo pipefail
          failed=0
          for file in lexicon.test.mjs authored.test.mjs cycle1.test.mjs grammar-core-v1.test.mjs; do
            src="/tmp/codex-source/packages/hnk-linguas/test/$file"
            dst="packages/hnk-linguas/test/$file"
            echo "::group::TEST-LOCK $file"
            if [[ ! -f "$src" ]]; then echo "MISSING SOURCE: $src"; failed=1; echo '::endgroup::'; continue; fi
            if [[ ! -f "$dst" ]]; then echo "MISSING DESTINATION: $dst"; failed=1; echo '::endgroup::'; continue; fi
            echo "SOURCE_SHA256=$(sha256sum "$src" | cut -d' ' -f1)"
            echo "DEST_SHA256=$(sha256sum "$dst" | cut -d' ' -f1)"
            if cmp --silent "$src" "$dst"; then
              echo 'BYTE_IDENTICAL=YES'
            else
              echo 'BYTE_IDENTICAL=NO'
              diff -u "$src" "$dst" | head -n 120 || true
              failed=1
            fi
            echo '::endgroup::'
          done
          if [[ "$failed" -ne 0 ]]; then
            echo 'TEST_LOCK_RESULT=FAIL'
            exit 1
          fi
          echo 'TEST_LOCK_RESULT=PASS'

      - name: Verify glyph authority boundary
        shell: bash
        run: |
          set -euo pipefail
          test -f packages/hnk-glyphs/src/index.mjs
          if grep -R -n -E "HNK40_SPRITE_SVG|getGlyphSvg|getSpriteUseSvg|frozen-sprite|renderer" packages/hnk-glyphs/src packages/hnk-linguas/src; then
            echo 'VISUAL AUTHORITY LEAK: renderer/sprite surface entered linguistic authority boundary.'
            exit 1
          fi
          if grep -R -n "@hnk/canon-contract" packages/hnk-glyphs packages/hnk-linguas; then
            echo 'CODEX AUTHORITY LEAK: @hnk/canon-contract dependency remains in Gate 03 packages.'
            exit 1
          fi
          echo 'AUTHORITY_BOUNDARY_RESULT=PASS'

      - name: Verify package dependency direction
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const linguas = JSON.parse(fs.readFileSync('packages/hnk-linguas/package.json','utf8'));
          const glyphs = JSON.parse(fs.readFileSync('packages/hnk-glyphs/package.json','utf8'));
          console.log('LINGUAS_DEPENDENCIES', linguas.dependencies ?? {});
          console.log('GLYPHS_DEPENDENCIES', glyphs.dependencies ?? {});
          if (!linguas.dependencies?.['@hnk/glyphs']) throw new Error('@hnk/linguas must depend on @hnk/glyphs');
          if (glyphs.dependencies?.['@hnk/linguas']) throw new Error('@hnk/glyphs must not depend on @hnk/linguas');
          if (linguas.dependencies?.['@hnk/canon-contract'] || glyphs.dependencies?.['@hnk/canon-contract']) throw new Error('CODEX canon-contract dependency is forbidden in Gate 03');
          console.log('DEPENDENCY_DIRECTION_RESULT=PASS');
          NODE

      - name: Link workspace dependency for standalone tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p packages/hnk-linguas/node_modules/@hnk
          ln -s "$(pwd)/packages/hnk-glyphs" packages/hnk-linguas/node_modules/@hnk/glyphs
          ls -la packages/hnk-linguas/node_modules/@hnk

      - name: Run glyph compatibility regression
        shell: bash
        run: node --test packages/hnk-glyphs/test/*.test.mjs

      - name: Run HNK linguas regression
        shell: bash
        run: node --test packages/hnk-linguas/test/*.test.mjs

      - name: Gate 03 attestation
        shell: bash
        run: |
          set -euo pipefail
          echo 'GATE-03 PASS CONDITIONS SATISFIED'
          echo 'Preservation: source-locked linguas runtime + regression tests byte-identical.'
          echo 'Independence: no canon-contract, renderer, sprite, or visual-authority dependency.'
          echo 'Runtime: glyph compatibility and linguas regression suites passed.'
