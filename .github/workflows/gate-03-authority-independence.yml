name: Gate 03 Authority Independence

on:
  push:
    branches:
      - gate-03-authority-independence
      - docs/hnk-linguas-consolidation
    paths:
      - 'packages/**'
      - 'canon/**'
      - 'docs/migration/**'
      - '.github/workflows/gate-03-authority-independence.yml'
  pull_request:
    paths:
      - 'packages/**'
      - 'canon/**'
      - 'docs/migration/**'
      - '.github/workflows/gate-03-authority-independence.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-authority-independence:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout HNK-KODE
        uses: actions/checkout@v4

      - name: Fetch frozen CODEX source
        shell: bash
        run: |
          set -euxo pipefail
          SOURCE_SHA='3027151d18176fd5ae46a04b2ac8ed8424bf68db'
          curl --fail --location --retry 3 \
            "https://github.com/tehknesolutions/codex-hnk/archive/${SOURCE_SHA}.tar.gz" \
            --output /tmp/codex-hnk.tar.gz
          mkdir -p /tmp/codex-source
          tar -xzf /tmp/codex-hnk.tar.gz --strip-components=1 -C /tmp/codex-source

      - name: Verify source-locked HNK linguas runtime
        shell: bash
        run: |
          set -euxo pipefail
          for file in index.mjs authored.mjs cycle1.mjs grammar-core-v1.mjs; do
            cmp --silent "/tmp/codex-source/packages/hnk-linguas/src/$file" "packages/hnk-linguas/src/$file" || {
              echo "SOURCE-LOCK DRIFT: packages/hnk-linguas/src/$file"
              exit 1
            }
          done

      - name: Verify preserved language regression tests
        shell: bash
        run: |
          set -euxo pipefail
          for file in lexicon.test.mjs authored.test.mjs cycle1.test.mjs grammar-core-v1.test.mjs; do
            cmp --silent "/tmp/codex-source/packages/hnk-linguas/test/$file" "packages/hnk-linguas/test/$file" || {
              echo "TEST DRIFT: packages/hnk-linguas/test/$file"
              exit 1
            }
          done

      - name: Verify recovered canon source-lock
        shell: bash
        run: |
          set -euxo pipefail
          for file in \
            canon/core/research-001-symbolic-architecture-v1.json \
            canon/governance/human-gates/research-001.json \
            canon/governance/human-gates/research-001-batch-001-approval.json \
            packages/canon-contract/src/index.mjs \
            packages/canon-contract/src/index.d.ts \
            packages/hnk-glyphs/src/canon.mjs \
            packages/hnk-glyphs/src/canon.d.ts \
            packages/hnk-glyphs/reference/HNK40_REFERENCE_MATRIX_V1.json \
            packages/hnk-glyphs/reference/README.md \
            packages/hnk-glyphs/test/reference-matrix.test.mjs; do
            cmp --silent "/tmp/codex-source/$file" "$file" || {
              echo "RECOVERED SOURCE-LOCK DRIFT: $file"
              exit 1
            }
          done

      - name: Verify glyph linguistic boundary
        shell: bash
        run: |
          set -euxo pipefail
          test -f packages/hnk-glyphs/src/index.mjs
          if grep -R -n -E "HNK40_SPRITE_SVG|getGlyphSvg|getSpriteUseSvg|frozen-sprite|renderer" packages/hnk-glyphs/src/index.mjs packages/hnk-linguas/src; then
            echo 'VISUAL AUTHORITY LEAK: renderer/sprite surface entered linguistic authority boundary.'
            exit 1
          fi
          if grep -R -n -E "codex-hnk|tehknesolutions/codex-hnk" packages/*/src; then
            echo 'REVERSE RUNTIME DEPENDENCY: HNK-KODE package source references CODEX-HNK.'
            exit 1
          fi

      - name: Verify package dependency direction
        shell: bash
        run: |
          set -euxo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const linguas = JSON.parse(fs.readFileSync('packages/hnk-linguas/package.json','utf8'));
          const glyphs = JSON.parse(fs.readFileSync('packages/hnk-glyphs/package.json','utf8'));
          if (!linguas.dependencies?.['@hnk/glyphs']) throw new Error('@hnk/linguas must depend on @hnk/glyphs');
          if (glyphs.dependencies?.['@hnk/linguas']) throw new Error('@hnk/glyphs must not depend on @hnk/linguas');
          if (glyphs.dependencies?.['@hnk/canon-contract'] !== 'workspace:*') throw new Error('@hnk/glyphs must consume the local @hnk/canon-contract compatibility boundary');
          if (linguas.dependencies?.['@hnk/canon-contract']) throw new Error('@hnk/linguas must not directly depend on @hnk/canon-contract');
          NODE

      - name: Link local workspace dependencies for standalone tests
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p node_modules/@hnk packages/hnk-linguas/node_modules/@hnk packages/hnk-glyphs/node_modules/@hnk
          ln -s "$(pwd)/packages/canon-contract" node_modules/@hnk/canon-contract
          ln -s "$(pwd)/packages/canon-contract" packages/hnk-glyphs/node_modules/@hnk/canon-contract
          ln -s "$(pwd)/packages/hnk-glyphs" packages/hnk-linguas/node_modules/@hnk/glyphs

      - name: Run recovered canon contract regression
        shell: bash
        run: node --test packages/canon-contract/test/*.test.mjs

      - name: Run glyph compatibility and reference regression
        shell: bash
        run: node --test packages/hnk-glyphs/test/*.test.mjs

      - name: Run HNK linguas regression
        shell: bash
        run: node --test packages/hnk-linguas/test/*.test.mjs

      - name: Gate 03 diagnostics artifact
        if: always()
        shell: bash
        run: |
          set +e
          mkdir -p gate-03-diagnostics
          {
            echo "GATE_03_DIAGNOSTICS"
            echo "commit=$GITHUB_SHA"
            echo "run=$GITHUB_RUN_ID"
            echo "job=$GITHUB_JOB"
            echo "runner=$RUNNER_OS"
            node --version 2>&1
            npm --version 2>&1
            echo "--- canon-contract ---"
            node --test packages/canon-contract/test/*.test.mjs; echo "exit=$?"
            echo "--- hnk-glyphs ---"
            node --test packages/hnk-glyphs/test/*.test.mjs; echo "exit=$?"
            echo "--- hnk-linguas ---"
            node --test packages/hnk-linguas/test/*.test.mjs; echo "exit=$?"
            echo "--- dependency tree ---"
            npm ls --all --depth=2 2>&1; echo "exit=$?"
          } > gate-03-diagnostics/diagnostic.txt 2>&1

      - name: Upload Gate 03 diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-03-diagnostics
          path: gate-03-diagnostics/diagnostic.txt
          if-no-files-found: error

      - name: Gate 03 attestation
        shell: bash
        run: |
          set -euxo pipefail
          echo 'GATE-03 PARITY CONDITIONS SATISFIED'
          echo 'Preservation: linguas + recovered canon/reference artifacts source-locked.'
          echo 'Compatibility: local canon contract validates 22 human-gated records.'
          echo 'Boundary: no reverse CODEX runtime dependency and no visual renderer authority leak.'
          echo 'Runtime: canon, glyph/reference and linguas regression suites passed.'
