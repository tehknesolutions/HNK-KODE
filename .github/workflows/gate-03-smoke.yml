name: Gate 03 Runner Smoke

on:
  push:
    branches:
      - gate-03-authority-independence
    paths:
      - '.github/workflows/gate-03-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Runner alive
        run: echo "GATE03_SMOKE_RUNNER_ALIVE"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Runtime diagnostics
        shell: bash
        run: |
          set -euo pipefail
          echo "GATE03_SMOKE_CHECKOUT_OK"
          node --version
          npm --version
          git --version
          pwd
          test -f package.json
          echo "GATE03_SMOKE_PASS"
