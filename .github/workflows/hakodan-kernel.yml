name: haKodan kernel

on:
  push:
    paths:
      - "packages/hakodan/**"
      - "spec/hakodan-*.json"
      - ".github/workflows/hakodan-kernel.yml"
  pull_request:
    paths:
      - "packages/hakodan/**"
      - "spec/hakodan-*.json"
      - ".github/workflows/hakodan-kernel.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test haKodan semantic equivalence
        run: node --test packages/hakodan/test/*.test.mjs
