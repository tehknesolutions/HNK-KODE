name: HNK 2647892 Mathematical Kernel

on:
  push:
    branches: [main]
    paths:
      - 'data/math/hnk-2647892.manifest.v1.json'
      - 'spec/hnk-2647892-kernel.schema.json'
      - 'tests/hnk-2647892-kernel.test.mjs'
      - 'packages/kodescript/**'
      - 'data/benchmarks/**'
      - 'spec/kodescript-language-eligibility*.json'
      - 'spec/hnk-family-expansion-corpus.schema.json'
      - 'data/acquisition/**'
      - 'docs/research/HNK-2647892-MATHEMATICAL-KERNEL.md'
      - '.github/workflows/hnk-2647892-kernel.yml'
  pull_request:
    paths:
      - 'data/math/hnk-2647892.manifest.v1.json'
      - 'spec/hnk-2647892-kernel.schema.json'
      - 'tests/hnk-2647892-kernel.test.mjs'
      - 'packages/kodescript/**'
      - 'data/benchmarks/**'
      - 'spec/kodescript-language-eligibility*.json'
      - 'spec/hnk-family-expansion-corpus.schema.json'
      - 'data/acquisition/**'
      - 'docs/research/HNK-2647892-MATHEMATICAL-KERNEL.md'
      - '.github/workflows/hnk-2647892-kernel.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-mathematical-kernel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Runtime info
        run: node --version

      - name: Verify HNK-2647892 invariants
        run: node --test tests/hnk-2647892-kernel.test.mjs

      - name: Verify KODESCRIPT contracts
        run: node --test packages/kodescript/test/*.test.mjs
