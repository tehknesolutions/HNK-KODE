name: HNK 2647892 Mathematical Kernel

on:
  push:
    branches: [main]
    paths:
      - 'data/math/hnk-2647892.manifest.v1.json'
      - 'spec/hnk-2647892-kernel.schema.json'
      - 'tests/hnk-2647892-kernel.test.mjs'
      - 'packages/kodescript/**'
      - 'data/benchmarks/**'
      - 'docs/research/HNK-2647892-MATHEMATICAL-KERNEL.md'
      - '.github/workflows/hnk-2647892-kernel.yml'
  pull_request:
    paths:
      - 'data/math/hnk-2647892.manifest.v1.json'
      - 'spec/hnk-2647892-kernel.schema.json'
      - 'tests/hnk-2647892-kernel.test.mjs'
      - 'packages/kodescript/**'
      - 'data/benchmarks/**'
      - 'docs/research/HNK-2647892-MATHEMATICAL-KERNEL.md'
      - '.github/workflows/hnk-2647892-kernel.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-mathematical-kernel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Runtime info
        run: node --version

      - name: Verify HNK-2647892 invariants
        run: node --test tests/hnk-2647892-kernel.test.mjs

      - name: Verify KODESCRIPT family classifier
        run: node --test packages/kodescript/test/*.test.mjs

      - name: Verify schema contract
        run: node -e "const s=require('./spec/hnk-2647892-kernel.schema.json'); if(s.properties.n.const!==12||s.properties.counts.properties.geometricClasses.const!==2647892) process.exit(1)"

      - name: Attestation
        run: echo "HNK-2647892 KERNEL PASS — N=12 — 2,647,892 geometric/render-distinct identities — semantics remain non-canonical"
